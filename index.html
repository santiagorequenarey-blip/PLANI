function bdByWord(t){let b,bs=9;BD.forEach((x,i)=>{const w=sg(nz(x[0]).split(/[ ,]/)[0]);if(w!==(BALIAS[t]||t))return;const s=BDN[i].length/100-(BDN[i].includes("crud")?1:0);if(s<bs){bs=s;b=i}});return b}
function bdFill(x,keep){const set=(k,v)=>{const e=$("#f_"+k);if(e)e.value=v};if(!keep)set("n",x[0]);set("cat",CATS[x[8]]);["k","p","c","s","f","fi","sa"].forEach((k,j)=>set(k,x[1+j]));const nt=$("#f_note");if(nt)nt.textContent="Rellenado desde BEDCA: "+x[0]+". Revisa y edita los valores antes de guardar."}
function bdComplete(){const ch=[];S.foods.forEach(f=>{if(f.fi&&f.s&&f.sa)return;const w=nz(f.n.replace(/\(.*/,"")).split(/\s+/).slice(0,2).join(" "),i=bdSearch(w,1)[0];if(i===undefined)return;const x=BD[i];if(Math.abs(x[1]-f.k)>Math.max(25,f.k*.35))return;
  const nw={};[["fi",6,"fibra"],["s",4,"azúcares"],["sa",7,"sal"]].forEach(([k,j,l])=>{if(!f[k]&&x[j]>0)nw[k]=[x[j],l]});if(Object.keys(nw).length)ch.push([f,nw,x[0]])});
 if(!ch.length)return alert("No hay valores vacíos que se puedan completar con seguridad.");
 if(!confirm("Se completarán solo campos vacíos (fibra, azúcares, sal) en "+ch.length+" alimentos:\n\n"+ch.slice(0,12).map(([f,nw,n])=>f.n+" ← "+n+": "+Object.values(nw).map(v=>v[1]+" "+v[0]).join(", ")).join("\n")+(ch.length>12?"\n…":"")+"\n\n¿Aplicar?"))return;
 ch.forEach(([f,nw])=>Object.entries(nw).forEach(([k,v])=>f[k]=v[0]));save();render()}
document.addEventListener("input",e=>{if(e.target.id!=="f_q")return;const r=bdSearch(e.target.value);$("#f_res").innerHTML=r.map(i=>{const x=BD[i];return `<button class="btn sm" style="display:block;width:100%;text-align:left;margin:2px 0" data-bd="${i}">${esc(x[0])} <span class="mu">· ${x[1]} kcal · P ${x[2]} H ${x[3]} G ${x[5]}</span></button>`}).join("")||`<span class="mu">Sin resultados en BEDCA</span>`});

 const wks=p.wk>=520?"más de 10 años":p.wk+" semanas (≈ "+(p.wk/4.345).toFixed(1)+" meses)",fin=new Date(Date.now()+p.wk*7*864e5).toLocaleDateString("es-ES",{month:"long",year:"numeric"});
 return `<div class="row" style="align-items:stretch">${box("📍 Con tu peso actual · "+i.w+" kg","Para mantener tu peso comerías",g.tdee,"kcal/día",`<div class="mu">Tu plan actual: <b>${g.kcal} kcal/día</b></div>`)}${box("🎯 Para llegar a tu peso objetivo · "+wt+" kg","Debes comer",p.kcalP||g.kcal,"kcal/día",`<div class="mu">${p.def?(p.def<0?"Déficit":"Superávit")+" de "+Math.abs(p.def)+" kcal/día · ≈ "+p.rate+" kg/semana":""}<br>Al llegar, tu mantenimiento será <b>${g.tdeeT} kcal/día</b></div>`)}</div>`+
 (p.dir?`<div class="card" style="margin-top:12px"><div class="mu">⏱ Tiempo estimado para pasar de ${i.w} a ${wt} kg</div><div style="font-size:36px;font-weight:800">${wks}</div>${p.wk<520?`<div class="mu">Fecha aproximada: ${fin}</div>`:""}${p.note?`<p class="warn">${p.note}</p>`:""}${p.rate/i.w>.01?`<p class="warn">El ritmo supera el 1 % del peso por semana: es agresivo, valora un objetivo más suave.</p>`:""}<p class="mu">Estimación con la regla de 7.700 kcal por kg, recalculando el gasto a medida que cambia tu peso. El ritmo real varía de una persona a otra.</p></div>`:`<div class="card" style="margin-top:12px"><b>Tu peso actual ya es tu peso objetivo.</b></div>`)+`<div style="height:12px"></div>`}
